name: Tag Professor Prospects

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-professors:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tag professor prospects
        run: node tag-professors.js

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data2.json
          git diff --cached --quiet && exit 0
          git commit -m "Tag professor prospects"
          git push
