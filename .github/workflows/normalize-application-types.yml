name: Normalize Application Types

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize application types
        run: node normalize-application-types.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json data2.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Normalize application types"
            git push
          fi
